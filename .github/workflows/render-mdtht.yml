name: Render And Deploy Mdtht Pages

on:
  push:
    paths:
      - "docker-frontend-complete-course.md"
      - "images/**"
      - "requirements-render.txt"
      - "scripts/render_mdtht.py"
      - "vendor/mdtht/**"
      - ".github/workflows/render-mdtht.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_MD: docker-frontend-complete-course.md
      OUTPUT_HTML: site/index.html
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: pip install -r requirements-render.txt

      - name: Render HTML
        run: python scripts/render_mdtht.py "$SOURCE_MD" "$OUTPUT_HTML" --asset-prefix "./"

      - name: Copy static assets
        run: |
          mkdir -p site/images site/vendor
          cp -R images/. site/images/
          cp -R vendor/. site/vendor/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
